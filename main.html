
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Cards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            height: 90%;
            display: flex;
            gap: 20px;
        }

        .panel {
            flex: 0.5;
            border-radius: 50px;
            position: relative;
            background-position: center;
            background-size: cover;
            cursor: pointer;
            transition: flex 0.5s ease-in;
        }

        .panel.active {
            flex: 5;
        }

        .panel .image-text {
            position: absolute;
            color: white;
            bottom: 30px;
            left: 30px;
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }

        .panel.active .image-text {
            opacity: 1;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="panel active"  id="panel-1" style="background-image: url('https://images.unsplash.com/photo-1558979158-65a1eaa08691?w=1350');">
            <h3 class="image-text">First image</h3>
        </div>

        <div class="panel" id="panel-2" style="background-image: url('https://images.unsplash.com/photo-1572276596237-5db2c3e16c5d?w=1350');">
            <h3 class="image-text">Second image</h3>
        </div>

        <div class="panel" id="panel-3"style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1350');">
            <h3 class="image-text">Third image</h3>
        </div>

        <div class="panel" id="panel-4" style="background-image: url('https://images.unsplash.com/photo-1551009175-8a68da93d5f9?w=1350');">
            <h3 class="image-text">Fourth image</h3>
        </div>

        <div class="panel" id="panel-5" style="background-image: url('https://images.unsplash.com/photo-1549880338-65ddcdfd017b?w=1350');">
            <h3 class="image-text">Fifth image</h3>
        </div>

    </div>

    <script>

        const panels = document.querySelectorAll(".panel");

        panels.forEach((panel) => {
            panel.addEventListener("click", () => {
                panels.forEach((p) => {
                    p.classList.remove("active");
                });
                panel.classList.add("active");

            });

        });

    </script>

</body>
</html>
